name: Verify Trimmy
on:
  push:
  pull_request:
jobs:
  api:
    name: API, domain and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@10.9.8 --ignore-scripts
      - run: npm ci
      - run: node tool/prepare-public-assets.mjs
      - run: npm run check
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: node tool/prepare-public-assets.mjs
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug --flavor production
        working-directory: apps/mobile
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@10.9.8 --ignore-scripts
      - run: npm ci
      - run: node tool/prepare-public-assets.mjs
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: bash infra/tests/run-postgres.sh
      - run: npm run test:mobile-sync
      # The deployment path: migrations against a TLS-only cluster, then the
      # real built API serving it over HTTP.
      - run: npm run test:migration-db
      - run: npm run test:deployment
