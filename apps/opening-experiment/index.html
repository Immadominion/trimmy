<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d82a1" />
    <title>Trimmy — Wall Street opening study</title>
    <link rel="preload" href="/fonts/BricolageGrotesque-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <main>
      <section class="scroll-route" aria-label="Wall Street opening study">
        <div class="stage">
          <div class="sky" aria-hidden="true"></div>
          <div class="sky-light" aria-hidden="true"></div>
          <div class="architecture" aria-hidden="true">
            <div class="plate plate--far" data-name="left-thin" data-from="0.02" data-to="0.34" data-rise="0.62" data-rest="0.11" data-push="0.31"><img src="/assets/left-thin.png" alt="" /></div>
            <div class="plate plate--far" data-name="right-far" data-from="0.03" data-to="0.37" data-rise="0.66" data-rest="0.15" data-push="0.32"><img src="/assets/right-far.png" alt="" /></div>
            <div class="plate plate--far" data-name="flag-tower" data-from="0.06" data-to="0.41" data-rise="0.74" data-rest="0.3" data-push="0.34"><img src="/assets/flag-tower.png" alt="" /></div>
            <div class="plate plate--mid" data-name="top-left" data-from="0.06" data-to="0.38" data-rise="0.48" data-push="0.36"><img src="/assets/top-left.png" alt="" /></div>
            <div class="plate plate--mid" data-name="top-right" data-from="0.07" data-to="0.39" data-rise="0.48" data-push="0.37"><img src="/assets/top-right.png" alt="" /></div>
            <div class="plate plate--mid" data-name="left-mid" data-from="0.08" data-to="0.43" data-rise="0.58" data-rest="0.06" data-push="0.39"><img src="/assets/left-mid.png" alt="" /></div>
            <div class="plate plate--mid" data-name="right-mid" data-from="0.09" data-to="0.45" data-rise="0.69" data-rest="0.15" data-push="0.4"><img src="/assets/right-mid.png" alt="" /></div>
            <div class="plate plate--mid" data-name="left-grid" data-from="0.10" data-to="0.46" data-rise="0.76" data-rest="0.2" data-push="0.43"><img src="/assets/left-grid.png" alt="" /></div>
            <div class="plate plate--near" data-name="flag" data-from="0.18" data-to="0.49" data-rise="0.86" data-rest="0.1" data-push="0.39"><img src="/assets/flag.png" alt="" /></div>
            <div class="plate plate--near" data-name="left-near" data-from="0.12" data-to="0.48" data-rise="0.83" data-push="0.47"><img src="/assets/left-near.png" alt="" /></div>
            <div class="plate plate--near" data-name="right-near" data-from="0.13" data-to="0.49" data-rise="0.78" data-push="0.47"><img src="/assets/right-near.png" alt="" /></div>
            <div class="plate plate--near" data-name="right-low" data-from="0.15" data-to="0.5" data-rise="0.88" data-rest="0.08" data-push="0.51"><img src="/assets/right-low.png" alt="" /></div>
            <div class="plate plate--front" data-name="pediment" data-from="0.17" data-to="0.52" data-rise="0.95" data-rest="0.17" data-push="0.54"><img src="/assets/pediment.png" alt="" /></div>
          </div>
          <div class="title" id="title">
            <p class="year">1653</p>
            <h1><span>A wall gave</span><span>a street</span><span>its name.</span></h1>
          </div>
          <div class="cloud" aria-hidden="true"><img src="/assets/cloud-top.webp" alt="" /></div>
          <div class="fog" aria-hidden="true"></div>
          <div class="next-story" id="next-story">
            <p class="year">1790</p>
            <h2>War debt became bonds.</h2>
            <p>Hamilton’s plan used federal bonds to pay Revolutionary War debts. Investors could buy and sell them, and New York became the center of that trade.</p>
          </div>
          <div class="scroll-cue" aria-hidden="true"><span>SCROLL</span><span class="scroll-cue__arrow">↓</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
